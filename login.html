<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lab Maintenance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat min-h-screen flex items-center justify-center" style="background-image: url('src/public/dashboardBg.png');">
    <div class="bg-white/25 backdrop-blur-md w-full max-w-md p-8 rounded-2xl border border-gray-200 shadow-md space-y-6">
        <div class="flex items-center justify-center">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-bold text-[#1e2d46]">Lab Maintenance</h1>
                <p class="text-gray-600 text-sm">A simple solution for managing lab equipments</p>
            </div>
        </div>
<div class="flex gap-2">
    <!-- Changed to a button with an ID for custom JavaScript handling -->
    <button id="getStartedBtn" type="button" class="relative z-10 pointer-events-auto block text-center bg-[#1e2d46] text-white font-semibold py-[12px] rounded-lg hover:bg-[#2c3e50] transition-colors shadow-sm cursor-pointer p-4">
        <span>👤</span><span id="currentUserRole">Get Started as User</span>
    </button>
    <button type="button" id="getStartedBtnAdmin"  class="h-20 relative z-10 pointer-events-auto block text-center bg-[#1e2d46] text-white font-semibold py-[12px] rounded-lg hover:bg-[#2c3e50] transition-colors shadow-sm cursor-pointer p-4">
                <span>🛠️</span>
                <span id="currentUserRole">Get Started as Admin</span>
            </button>
</div>
    </div>
<script src="src/js/firebase-config.js"></script>
<script src="src/js/app.js"></script>
</body>
</html>
