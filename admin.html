<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Lab Maintenance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased font-sans min-h-screen">
    <!-- Header -->
    <header class="h-[70px] bg-white border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🛠️</span>
            <h1 class="text-xl font-bold text-[#1e2d46]">Admin Portal</h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="enableNotiBtn" onclick="requestNotificationPermission()" class="px-3.5 py-1.5 text-xs font-semibold bg-indigo-50 text-indigo-600 border border-indigo-200 rounded-lg hover:bg-indigo-100 transition-colors flex items-center gap-1.5">
                <span>🔔</span> Enable Desktop Alerts
            </button>
            <span class="text-sm font-medium text-slate-500">|</span>
            <button onclick="logout()" class="px-4 py-2 text-xs font-semibold bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                Log Out
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-8 space-y-8">
        <!-- Analytics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Reports</p>
                    <p id="adminTotal" class="text-3xl font-bold text-slate-800 mt-2">0</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl">📋</div>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Pending Repair</p>
                    <p id="adminPending" class="text-3xl font-bold text-amber-600 mt-2">0</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">⏳</div>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Completed</p>
                    <p id="adminCompleted" class="text-3xl font-bold text-emerald-600 mt-2">0</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">✅</div>
            </div>
        </div>

        <!-- Live Reports Table -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800">Maintenance Tickets</h2>
                <span class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-3 py-1 rounded-full">Real-time sync</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs font-semibold uppercase tracking-wider border-b border-slate-100">
                            <th class="p-4">Ticket ID</th>
                            <th class="p-4">Lab Location</th>
                            <th class="p-4">Equipment</th>
                            <th class="p-4">Issue Description</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminReportTable" class="divide-y divide-slate-100 text-sm text-slate-700">
                        <tr>
                            <td colspan="6" class="p-6 text-center text-slate-400">Loading live reports...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="src/js/firebase-config.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
