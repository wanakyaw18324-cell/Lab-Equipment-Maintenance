<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#f5f3ff] min-h-screen flex items-center justify-center p-6">
<div class="bg-white w-full max-w-md p-8 rounded-xl border border-gray-200 shadow-sm space-y-6">
    <div class="flex items-center justify-between border-b pb-4">
        <h1 class="text-2xl font-bold text-[#1e2d46]">User Portal</h1>
        <button onclick="logout()" class="px-3 py-1.5 text-xs font-semibold bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors">
            Log Out
        </button>
    </div>
    
    <div class="space-y-4">
        <h2 class="text-lg font-semibold text-gray-700">Report Laptop Problem</h2>
        <input id="laptop" placeholder="Laptop ID" class="w-full p-[12px] border border-gray-300 rounded-[5px] focus:outline-none focus:ring-2 focus:ring-[#1e2d46]">
        <textarea id="problem" placeholder="Enter your problem" class="w-full p-[12px] border border-gray-300 rounded-[5px] h-[100px] resize-none focus:outline-none focus:ring-2 focus:ring-[#1e2d46]"></textarea>
        <button onclick="sendReport()" class="w-full bg-[#1e2d46] text-white font-medium py-[12px] rounded-[5px] hover:bg-[#2c3e50] transition-colors">Send Report</button>
    </div>

    <div class="space-y-2 border-t pt-4">
        <h2 class="text-lg font-semibold text-gray-700">🔔 Live Notifications</h2>
        <div id="userNotification" class="bg-gray-50 p-4 rounded-lg border text-gray-600 text-sm">Listening for live updates...</div>
    </div>
</div>
<script src="src/js/firebase-config.js"></script>
<script src="src/js/app.js"></script>
</body>
</html>
